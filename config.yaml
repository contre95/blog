# exampleSite/config.yaml
baseURL: https://blog.contre.io
languageCode: en-US
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
languages:
  es:
    disabled: false
    languageCode: es-ES
    languageDirection: ltr
    languageName: Español
    # params:
    #   subtitle: Lectur
    title: Contre
    weight: 1
    menus:
      main:
        - identifier: home
          name: Inicio
          url: /es
          weight: 1
        - identifier: posts
          name: Publicaciones
          url: /es/posts/
          weight: 3
        - identifier: rss
          name: RSS
          url: /es/posts/index.xml
          weight: 4
        - identifier: memos
          name: Memos
          url: https://memos.contre.io/explore
          weight: 5
          params:
            target: _blank
        - identifier: EN
          name: English
          url: /en
          weight: 6
  en:
    disabled: false
    languageCode: en
    languageDirection: ltr
    languageName: English
    # params:
    #   subtitle: Reference, Tutorials, and Explanations
    title: Contre
    weight: 0
    menus:
      main:
        - identifier: home
          name: Home
          url: /en
          weight: 1
        # - identifier: about
        #   name: About
        #   url: /about/
        # weight: 2
        - identifier: posts
          name: Posts
          url: /en/posts/
          weight: 3
        - identifier: rss
          name: RSS
          url: /en/posts/index.xml
          weight: 4
        - identifier: memos
          name: Memos
          url: https://memos.contre.io/explore
          weight: 5
          params:
            target: _blank
        - identifier: ES
          name: Spanish
          url: /es
          weight: 6
theme: smigle
themesDir: themes
title: Contre
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: about
      name: About
      url: /about/
      weight: 2
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 3
    - identifier: rss
      name: RSS
      url: /posts/index.xml
      weight: 4
    - identifier: memos
      name: Memos
      url: https://memos.contre.io/explore
      weight: 5
      params:
        target: _blank
translationKey: about
params:
  abbrDateFmt: "Jan 2"
  author: "Blog Author"
  brandIconFile: "images/img.svg"
  dateFmt: "2006-01-02"
  subtitle: "|||||||||||"
